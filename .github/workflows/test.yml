name: Test and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=zip --output=laas-ci-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: laas-ci-source-${{ github.sha }}
          path: laas-ci-source.zip
          retention-days: 3
  tests:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - name: Run tests with bounded diagnostics
        timeout-minutes: 8
        env:
          PYTHONUNBUFFERED: "1"
        run: python -X faulthandler -m pytest -vv --durations=20 -o faulthandler_timeout=45 --junitxml=runtime/ci-results.xml
      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.python }}
          path: runtime/ci-results.xml
          if-no-files-found: ignore
          retention-days: 7
  windows-artifact:
    runs-on: windows-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - shell: pwsh
        run: |
          $download = Join-Path $env:RUNNER_TEMP 'inno-6.7.3.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $download
          if ((Get-FileHash $download -Algorithm SHA256).Hash -ne '9c73c3bae7ed48d44112a0f48e66742c00090bdb5bef71d9d3c056c66e97b732') { throw 'Compiler checksum mismatch' }
          $compiler = Join-Path $env:RUNNER_TEMP 'station-inno'
          $process = Start-Process $download -ArgumentList "/CURRENTUSER /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /NOICONS /DIR=`"$compiler`"" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Compiler setup failed' }
          ./build_installer.ps1 -ISCC (Join-Path $compiler 'ISCC.exe')
      - shell: pwsh
        run: ./tools/test_installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: LocalAgentAIStation-Windows-Setup
          path: |
            dist/release/*
            runtime/installer-test/report.json
